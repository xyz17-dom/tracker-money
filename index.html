<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Tracker Money</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#5B5BD6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Tracker Money" />

    <!-- Memasang tema sebelum halaman pertama digambar, supaya tidak ada
         kedipan terang saat memilih tema gelap -->
    <script>
      try {
        var t = localStorage.getItem('tema')
        var gelap =
          t === 'dark' ||
          ((t === null || t === 'system') &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = gelap ? 'dark' : 'light'
      } catch (e) {}
    </script>

    <!-- Gaya layar pembuka ditulis langsung di sini agar tampil seketika,
         sebelum berkas CSS aplikasi selesai dimuat. Hanya animasi: tiga batang
         tumbuh bergiliran, lalu nama aplikasi muncul. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f5fb;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      [data-theme='dark'] #splash {
        background: #14141f;
      }
      #splash.selesai {
        opacity: 0;
        visibility: hidden;
      }
      #splash .isi {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #splash svg {
        width: 120px;
        height: 90px;
        overflow: visible;
      }
      #splash .b {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: splash-naik 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .b1 { fill: #c9c9f2; animation-delay: 0.2s; }
      #splash .b2 { fill: #c9c9f2; animation-delay: 0.45s; }
      #splash .b3 { fill: #5b5bd6; animation-delay: 0.7s; }
      [data-theme='dark'] #splash .b1,
      [data-theme='dark'] #splash .b2 { fill: #3a3a58; }
      [data-theme='dark'] #splash .b3 { fill: #6c6ce5; }
      #splash p {
        margin: 0;
        font: 600 17px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.03em;
        color: #22223b;
        animation: splash-teks 0.6s ease 1.1s both;
      }
      [data-theme='dark'] #splash p {
        color: #ececf6;
      }
      @keyframes splash-naik {
        0% { transform: scaleY(0); }
        70% { transform: scaleY(1.08); }
        100% { transform: scaleY(1); }
      }
      @keyframes splash-teks {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .b, #splash p {
          animation: none;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="isi">
        <svg viewBox="0 0 100 72" role="presentation">
          <rect class="b b1" x="8" y="44" width="22" height="24" rx="6" />
          <rect class="b b2" x="39" y="28" width="22" height="40" rx="6" />
          <rect class="b b3" x="70" y="8" width="22" height="60" rx="6" />
        </svg>
        <p>Tracker Money</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
